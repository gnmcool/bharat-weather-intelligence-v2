# Immutable daily forecast archive (M4 archive foundation). Replaces the M0 monthly appendable release.
# One release per IST day (archive-daily-YYYY-MM-DD): collected -> validated -> draft -> checksums verified ->
# published (immutable: assets and tag locked) -> re-verified -> index committed to the archive-index branch.
# Refuses to publish anything incomplete; a refused day is recorded in the index with its gap report.
# Reads CORE's public API/store and Open-Meteo only. Never writes to CORE.
name: Forecast archive (daily, immutable)

on:
  schedule:
    - cron: "30 5 * * *"   # 11:00 IST
    - cron: "30 9 * * *"   # 15:00 IST retry (no-op if the day is already published)
  workflow_dispatch:
    inputs:
      inject:
        description: "Acceptance tests only: fault to inject (the run must refuse to publish)"
        type: choice
        options: [none, checksum, missing_row, bad_lead]
        default: none
      legacy:
        description: "One-off: preserve the M0 release as an immutable, clearly marked legacy release"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: archive
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  INJECT: ${{ inputs.inject || 'none' }}

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: archive/requirements*.txt
      - run: pip install -r archive/requirements.txt

      - name: Index branch checkout
        run: |
          git config --global user.name "bwi-archive"
          git config --global user.email "bwi-archive@users.noreply.github.com"
          IDX="$RUNNER_TEMP/index"
          if git ls-remote --exit-code --heads origin archive-index >/dev/null; then
            git fetch -q origin archive-index && git worktree add -q "$IDX" origin/archive-index && git -C "$IDX" checkout -q -B archive-index
          else
            git worktree add -q --detach "$IDX" && git -C "$IDX" switch -q --orphan archive-index && \
            printf '# Archive index\n\nAppend-only record of the immutable daily forecast archive. See docs/ARCHIVE.md on main.\n' > "$IDX/README.md"
          fi
          echo "IDX=$IDX" >> "$GITHUB_ENV"

      - name: Preserve M0 legacy release (one-off)
        if: ${{ inputs.legacy }}
        run: bash archive/legacy_m0.sh

      - name: Skip if today is already published
        id: done
        if: ${{ !inputs.legacy }}
        run: |
          DAY=$(TZ=Asia/Kolkata date +%F); TAG="archive-daily-$DAY"
          echo "DAY=$DAY" >> "$GITHUB_ENV"; echo "TAG=$TAG" >> "$GITHUB_ENV"
          draft=$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null || echo none)
          if [ "$draft" = "false" ] && [ "$INJECT" = "none" ]; then echo "already=true" >> "$GITHUB_OUTPUT"; echo "$TAG already published"; fi
          if [ "$draft" = "true" ]; then gh release delete "$TAG" -y; echo "removed stale draft $TAG"; fi

      - name: Collect
        if: ${{ !inputs.legacy && steps.done.outputs.already != 'true' }}
        run: |
          START=$(date +%s)
          python archive/collect.py --out "$RUNNER_TEMP/stage" --inject "$INJECT"
          echo "COLLECT_S=$(( $(date +%s) - START ))" >> "$GITHUB_ENV"

      - name: Validate (refuse incomplete data)
        id: validate
        if: ${{ !inputs.legacy && steps.done.outputs.already != 'true' }}
        run: python archive/validate.py "$RUNNER_TEMP/stage"

      - name: Record refusal in the index
        if: ${{ failure() && !inputs.legacy && steps.done.outputs.already != 'true' }}
        run: |
          python archive/index.py --stage "$RUNNER_TEMP/stage" --index "$IDX" --status refused --run-id "$GITHUB_RUN_ID" || true
          cd "$IDX" && git add -A && git commit -qm "archive: refused $DAY (run $GITHUB_RUN_ID, inject=$INJECT)" && git push -q origin archive-index
          if gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null | grep -q true; then gh release delete "$TAG" -y; fi
          echo "Nothing was published for $DAY."

      - name: Publish immutable release
        if: ${{ !inputs.legacy && steps.done.outputs.already != 'true' }}
        run: |
          [ "$INJECT" = "none" ] || { echo "Injected fault passed validation — refusing"; exit 1; }
          S="$RUNNER_TEMP/stage"
          gh release create "$TAG" --draft --latest=false --title "Forecast archive $DAY" \
            --notes "Immutable daily forecast archive for $DAY (IST). Manifest SHA-256 and gap report are committed to the archive-index branch. Data, not a software release." \
            "$S"/forecasts_*.parquet "$S"/core_risks_*.parquet "$S"/core_daily_*.parquet "$S"/e2s_gfs_grid_*.nc "$S"/manifest_*.json "$S"/gap_report_*.json
          python archive/verify_release.py --tag "$TAG" --stage "$S" --out "$RUNNER_TEMP/pre.json"
          gh release edit "$TAG" --draft=false --latest=false
          python archive/verify_release.py --tag "$TAG" --stage "$S" --out "$RUNNER_TEMP/checks.json" --published

      - name: Commit index
        if: ${{ !inputs.legacy && steps.done.outputs.already != 'true' }}
        run: |
          URL=$(gh release view "$TAG" --json url -q .url)
          python archive/index.py --stage "$RUNNER_TEMP/stage" --index "$IDX" --status published --tag "$TAG" --release-url "$URL" \
            --checks "$RUNNER_TEMP/checks.json" --run-id "$GITHUB_RUN_ID"
          cd "$IDX" && git add -A && git commit -qm "archive: published $DAY ($TAG)" && git push -q origin archive-index
          {
            echo "### Archive $DAY published"; echo; echo "- collection: ${COLLECT_S}s"; echo "- release: $URL"
            du -ch "$RUNNER_TEMP"/stage/* | tail -1 | sed 's/^/- staged size: /'
          } >> "$GITHUB_STEP_SUMMARY"
