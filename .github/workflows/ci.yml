# Build validation for every push and pull request. Offline: does not call CORE.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Web — typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx vite build

  archive:
    name: Archive — tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: archive/requirements*.txt
      - run: pip install -r archive/requirements.txt -r archive/requirements-dev.txt
      - run: python -m pytest -q archive/tests
      - name: History (M4.2) — offline tests
        run: python -m pytest -q history/tests
      - name: Verification (M4.4) — offline tests
        run: python -m pytest -q verification/tests
      - run: pip install -r reference/requirements.txt && python -m pytest -q reference/tests

  api-v2:
    name: API v2 — tests (offline, CORE fixtures)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-v2/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
