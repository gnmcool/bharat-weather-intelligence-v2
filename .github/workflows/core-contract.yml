# Checks that CORE's live API still provides every endpoint/field V2 depends on
# (contract/core-api-contract.json). Read-only GETs against CORE. Separate from CI so a CORE
# outage never blocks V2 builds, but any contract drift is reported.
name: CORE contract

on:
  schedule:
    - cron: "15 1 * * *"   # 06:45 IST daily
  pull_request:
    paths: ["contract/**", "web/src/core-api/**", "api-v2/app/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node contract/check-core-contract.mjs "${{ vars.CORE_ORIGIN || 'https://bharat-weather-intelligence-brown.vercel.app' }}"
