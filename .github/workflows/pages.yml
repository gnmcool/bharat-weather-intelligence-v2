# V2 website -> GitHub Pages (https://gnmcool.github.io/bharat-weather-intelligence-v2/).
# Consumes CORE read-only over its public API (repository variable CORE_API_BASE).
name: V2 website (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build
        working-directory: web
        env:
          VITE_CORE_API_BASE: ${{ vars.CORE_API_BASE || 'https://bharat-weather-intelligence-brown.vercel.app/api/v1' }}
          VITE_API_V2_BASE: ${{ vars.API_V2_BASE || 'https://bwi-api-v2.vercel.app/api/v2' }}
          VITE_APP_ENV: preview
        run: |
          npm ci
          npx tsc -b
          npx vite build --base=/${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
