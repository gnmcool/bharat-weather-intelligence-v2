# M4.4-A Gate 2 hold: ONE owner-approved, read-only source probe (30 Sep 2026). No schedule.
# Runs when this file is committed to the m4-history review branch (the same one-off mechanism as the M4.2
# probe; workflow_dispatch needs the file on main, which is not changed). Do not edit this file afterwards: an edit
# would trigger a second run.
# Uses the probe code exactly as committed at ced65d6 (verified below). About 12 requests / 36 counted Open-Meteo
# calls. Reads three verified immutable releases for the archive comparison. Writes only a new, append-only record
# under archive-index history/verification/source-probe/<run_id>/. Never modifies releases, census, Gate 2
# results, CORE or the prospective archive.
name: Verification source probe (M4.4-A hold, one-off)

on:
  push:
    branches: ["m4-history"]
    paths: [".github/workflows/verification-source-probe.yml"]

permissions:
  contents: write

concurrency:
  group: verification-source-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r archive/requirements.txt pytest
      - name: Probe code is exactly ced65d6
        run: git diff --exit-code ced65d6 HEAD -- verification history
      - name: Offline probe tests
        run: python -m pytest -q verification/tests/test_source_probe.py
      - name: Verify the three archived months used for comparison (read-only)
        run: |
          python - <<'EOF'
          import pathlib, sys, json
          sys.path.insert(0, "verification")
          from inputs import GitHubSource, load_index, load_month
          src = GitHubSource(pathlib.Path("/tmp/cache"), ca=None)   # runner: system CA store
          recs, _ = load_index(src)
          out = {}
          for m in ("2024-07", "2025-01", "2025-07"):
              md = load_month(src, recs[m])      # refuses unless published, immutable, hashes match
              out[m] = md["provenance"]["manifest_sha256"]
          print(json.dumps({"archive_index_commit": src.index_commit, "verified_manifests": out}))
          pathlib.Path("/tmp/verified.json").write_text(json.dumps({"archive_index_commit": src.index_commit,
                                                                  "verified_manifests": out}, indent=1))
          EOF
      - name: Probe (single run; each request twice for determinism)
        id: probe
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/probe"
          python verification/source_probe.py --out "$RUNNER_TEMP/probe" --cache /tmp/cache --confirm-network \
            2>&1 | tee "$RUNNER_TEMP/probe/probe_log.txt"
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          cp /tmp/verified.json "$RUNNER_TEMP/probe/verified_releases.json" || true
      - name: Commit probe outputs to archive-index (append-only)
        if: always()
        run: |
          git config --global user.name "bwi-archive"
          git config --global user.email "bwi-archive@users.noreply.github.com"
          IDX="$RUNNER_TEMP/index"
          git fetch -q origin archive-index
          git worktree add -q "$IDX" origin/archive-index && git -C "$IDX" checkout -q -B archive-index
          DEST="$IDX/history/verification/source-probe/$GITHUB_RUN_ID"
          mkdir -p "$RUNNER_TEMP/probe" "$DEST"
          cp "$RUNNER_TEMP"/probe/* "$DEST"/ 2>/dev/null || echo "no probe outputs (probe did not run)" > "$DEST/NOTE.txt"
          (cd "$DEST" && sha256sum * > SHA256SUMS)
          cd "$IDX" && git add history && git commit -qm "verification: M4.4-A hold source probe run $GITHUB_RUN_ID (exit ${{ steps.probe.outputs.exit }}; code ced65d6)"
          for i in 1 2 3; do git push -q origin archive-index && break; git pull -q --rebase origin archive-index; done
      - name: Probe status
        run: |
          echo "probe exit code ${{ steps.probe.outputs.exit }}"
          [ "${{ steps.probe.outputs.exit }}" = "0" ]
